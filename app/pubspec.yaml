name: synapse
description: Synapse - AI 驱动的个人知识管理系统
publish_to: 'none'
version: 2.2.25+67

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  flutter_markdown: ^0.6.14
  flutter_svg: ^2.0.9
  shared_preferences: ^2.2.2
  share_plus: ^10.0.0
  graphview: ^1.2.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.2
  open_file: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/MiSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/MiSans-Semibold.ttf
          weight: 600
        - asset: assets/fonts/MiSans-Bold.ttf
          weight: 700

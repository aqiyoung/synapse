name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor

      - name: Get version from pubspec
        id: version
        working-directory: ./app
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: ./app
        run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/android/release-key.jks
          echo "storeFile=${{ github.workspace }}/app/android/release-key.jks" > app/android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> app/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> app/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> app/android/key.properties

      - name: Build APK
        working-directory: ./app
        run: flutter build apk --release

      - name: Cleanup keystore
        if: always()
        run: rm -f app/android/release-key.jks app/android/key.properties

      - name: Rename APK
        run: |
          mv app/build/app/outputs/flutter-apk/app-release.apk \
             app/build/app/outputs/flutter-apk/synapse-v${{ steps.version.outputs.version }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: synapse-v${{ steps.version.outputs.version }}
          path: app/build/app/outputs/flutter-apk/synapse-v${{ steps.version.outputs.version }}.apk
          retention-days: 30

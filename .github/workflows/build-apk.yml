name: Build Android APK

on:
  push:
    branches: [ main, beta ]
    paths:
      - 'app/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor

      - name: Get version from pubspec
        id: version
        working-directory: ./app
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Determine release tag
        id: tag
        run: |
          BASE_VERSION="${{ steps.version.outputs.version }}"
          SEMVER=$(echo "$BASE_VERSION" | sed 's/+.*//')

          # beta 分支 push → beta 版（Pre-release）
          # main 分支 push 或 workflow_dispatch → 正式版（Latest）
          IS_STABLE="true"
          if [ "${{ github.ref }}" = "refs/heads/beta" ] && [ "${{ github.event_name }}" = "push" ]; then
            IS_STABLE="false"
          fi

          if [ "$IS_STABLE" = "true" ]; then
            echo "tag=v$SEMVER" >> $GITHUB_OUTPUT
            echo "name=Synapse v$SEMVER" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            # Beta: 查找同版本已有的 beta tag，自动递增
            LATEST_BETA=$(git tag -l "v${SEMVER}-beta.*" | sort -V | tail -1)
            if [ -z "$LATEST_BETA" ]; then
              BETA_NUM=1
            else
              BETA_NUM=$(echo "$LATEST_BETA" | grep -oP 'beta\.\K[0-9]+')
              BETA_NUM=$((BETA_NUM + 1))
            fi
            echo "tag=v${SEMVER}-beta.${BETA_NUM}" >> $GITHUB_OUTPUT
            echo "name=Synapse v${SEMVER}-beta.${BETA_NUM}" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        working-directory: ./app
        run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/android/release-key.jks
          echo "storeFile=${{ github.workspace }}/app/android/release-key.jks" > app/android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> app/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> app/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> app/android/key.properties

      - name: Build APK
        working-directory: ./app
        run: flutter build apk --release

      - name: Cleanup keystore
        if: always()
        run: rm -f app/android/release-key.jks app/android/key.properties

      - name: Rename APK
        run: |
          mv app/build/app/outputs/flutter-apk/app-release.apk \
             app/build/app/outputs/flutter-apk/synapse-${{ steps.tag.outputs.tag }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: synapse-${{ steps.tag.outputs.tag }}
          path: app/build/app/outputs/flutter-apk/synapse-${{ steps.tag.outputs.tag }}.apk
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          files: app/build/app/outputs/flutter-apk/synapse-${{ steps.tag.outputs.tag }}.apk
          generate_release_notes: true
          prerelease: ${{ steps.tag.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

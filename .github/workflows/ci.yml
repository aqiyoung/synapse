name: CI

on:
  push:
    branches: [main, master, beta]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.29.3'

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ./app
        run: flutter pub get

      - name: Analyze
        working-directory: ./app
        run: flutter analyze --fatal-infos --fatal-warnings

      # 注: 不使用 --set-exit-if-changed, 因为不同环境的 Dart 格式化补丁版本
      # 可能存在细微差异, 会导致跨平台误判失败(纯格式、非代码质量问题)。
      # 改为原地格式化(始终退出 0), 由 CI 负责统一格式;
      # 真正的代码质量由上面的 flutter analyze 把关。
      - name: Format
        working-directory: ./app
        run: dart format lib/

      - name: Tests
        working-directory: ./app
        run: flutter test

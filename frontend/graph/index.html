<!DOCTYPE html><html lang="zh-CN"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>知识图谱</title><meta name="description" content="AI 知识管理笔记系统"><link rel="icon" type="image/x-icon" href="/favicon.png"></head> <body class="min-h-screen bg-[#fafaf8] text-neutral-800 antialiased dark:bg-neutral-950 dark:text-neutral-200">  <div class="container mx-auto px-5 py-8"> <h1 class="mb-2 text-3xl font-bold text-neutral-800 dark:text-neutral-100">知识图谱</h1> <p id="graphStats" class="mb-6 text-sm text-neutral-500">加载中...</p> <div id="graphContainer" class="rounded-xl border border-neutral-200 bg-white p-4 dark:border-neutral-700 dark:bg-neutral-900"> <svg id="graphSvg" viewBox="0 0 800 600" class="h-[70vh] w-full"></svg> </div> </div> <script type="module">const x="/api";async function $(){try{const n=await fetch(`${x}/graph`);if(!n.ok)throw new Error("Failed to fetch");const d=await n.json(),c=d.nodes||[],g=d.edges||[];document.getElementById("graphStats").textContent=`${c.length} 节点 · ${g.length} 连接`;const h=document.getElementById("graphSvg");let s="";g.forEach(t=>{const e=c.find(l=>l.id===t.source),o=c.find(l=>l.id===t.target);if(!e||!o)return;const r=(e.x||0)+400,a=(e.y||0)+300,i=(o.x||0)+400,y=(o.y||0)+300;s+=`<line x1="${r}" y1="${a}" x2="${i}" y2="${y}" stroke="#d4d4d4" stroke-width="1" opacity="0.6"/>`}),c.forEach(t=>{const e=(t.x||0)+400,o=(t.y||0)+300,r=3+(t.degree||0)*2,a=t.color||"#8d9e8a",i=t.title.length>8?t.title.substring(0,8)+"...":t.title;s+=`<circle cx="${e}" cy="${o}" r="${Math.min(r,20)}" fill="${a}" opacity="0.9"/>`,(t.degree||0)>=3&&(s+=`<text x="${e}" y="${o+4}" text-anchor="middle" fill="white" font-size="10">${i}</text>`)}),h.innerHTML=s}catch(n){document.getElementById("graphStats").textContent="加载失败",console.error("Failed to load graph:",n)}}$();</script>  </body></html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="#c96442"/>
  <!-- Connection lines -->
  <line x1="60" y1="30" x2="35" y2="55" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="60" y1="30" x2="85" y2="55" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="35" y1="55" x2="60" y2="80" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="85" y1="55" x2="60" y2="80" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="35" y1="55" x2="85" y2="55" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="60" y1="30" x2="60" y2="80" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Central node (synapse) -->
  <circle cx="60" cy="55" r="8" fill="#fff"/>
  <!-- Top node -->
  <circle cx="60" cy="30" r="5" fill="#fff" opacity="0.85"/>
  <!-- Left node -->
  <circle cx="35" cy="55" r="5" fill="#fff" opacity="0.85"/>
  <!-- Right node -->
  <circle cx="85" cy="55" r="5" fill="#fff" opacity="0.85"/>
  <!-- Bottom node -->
  <circle cx="60" cy="80" r="5" fill="#fff" opacity="0.85"/>
  <!-- Small accent nodes -->
  <circle cx="45" cy="40" r="2.5" fill="#fff" opacity="0.5"/>
  <circle cx="75" cy="40" r="2.5" fill="#fff" opacity="0.5"/>
  <circle cx="45" cy="70" r="2.5" fill="#fff" opacity="0.5"/>
  <circle cx="75" cy="70" r="2.5" fill="#fff" opacity="0.5"/>
</svg>

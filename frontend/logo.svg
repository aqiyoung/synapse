<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- 渐变背景 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <!-- 发光效果 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- 阴影效果 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGradient)" filter="url(#shadow)"/>

  <!-- 内部装饰圆环 -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="#fff" stroke-width="1" opacity="0.2"/>
  <circle cx="60" cy="60" r="32" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.15"/>

  <!-- 知识节点网络 -->
  <!-- 中心主节点 -->
  <circle cx="60" cy="58" r="10" fill="#fff" filter="url(#glow)"/>
  <circle cx="60" cy="58" r="6" fill="url(#bgGradient)"/>

  <!-- 周围节点 -->
  <circle cx="42" cy="42" r="6" fill="#fff" opacity="0.9"/>
  <circle cx="78" cy="42" r="6" fill="#fff" opacity="0.9"/>
  <circle cx="42" cy="74" r="6" fill="#fff" opacity="0.9"/>
  <circle cx="78" cy="74" r="6" fill="#fff" opacity="0.9"/>

  <!-- 连接线 -->
  <line x1="48" y1="48" x2="54" y2="54" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="72" y1="48" x2="66" y2="54" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="48" y1="68" x2="54" y2="62" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="72" y1="68" x2="66" y2="62" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="42" y1="48" x2="42" y2="68" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="78" y1="48" x2="78" y2="68" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="48" y1="42" x2="72" y2="42" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="48" y1="74" x2="72" y2="74" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- 小装饰节点 -->
  <circle cx="35" cy="58" r="3" fill="#fff" opacity="0.6"/>
  <circle cx="85" cy="58" r="3" fill="#fff" opacity="0.6"/>
  <circle cx="60" cy="35" r="3" fill="#fff" opacity="0.6"/>
  <circle cx="60" cy="81" r="3" fill="#fff" opacity="0.6"/>

  <!-- AI 光点效果 -->
  <circle cx="52" cy="50" r="1.5" fill="#fff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="68" cy="50" r="1.5" fill="#fff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="66" r="1.5" fill="#fff" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>

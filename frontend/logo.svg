<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- 阴影效果 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="60" cy="60" r="56" fill="#ffffff" filter="url(#shadow)"/>

  <!-- 内部装饰圆环 -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="60" cy="60" r="32" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>

  <!-- 知识节点网络 -->
  <!-- 中心主节点 -->
  <circle cx="60" cy="58" r="10" fill="#4299e1"/>
  <circle cx="60" cy="58" r="5" fill="#ffffff"/>

  <!-- 周围节点 -->
  <circle cx="42" cy="42" r="6" fill="#4299e1"/>
  <circle cx="78" cy="42" r="6" fill="#4299e1"/>
  <circle cx="42" cy="74" r="6" fill="#4299e1"/>
  <circle cx="78" cy="74" r="6" fill="#4299e1"/>

  <!-- 连接线 -->
  <line x1="48" y1="48" x2="54" y2="54" stroke="#4299e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="72" y1="48" x2="66" y2="54" stroke="#4299e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="68" x2="54" y2="62" stroke="#4299e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="72" y1="68" x2="66" y2="62" stroke="#4299e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="48" x2="42" y2="68" stroke="#4299e1" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="78" y1="48" x2="78" y2="68" stroke="#4299e1" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="48" y1="42" x2="72" y2="42" stroke="#4299e1" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="48" y1="74" x2="72" y2="74" stroke="#4299e1" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- 小装饰节点 -->
  <circle cx="35" cy="58" r="3" fill="#4299e1" opacity="0.6"/>
  <circle cx="85" cy="58" r="3" fill="#4299e1" opacity="0.6"/>
  <circle cx="60" cy="35" r="3" fill="#4299e1" opacity="0.6"/>
  <circle cx="60" cy="81" r="3" fill="#4299e1" opacity="0.6"/>
</svg>
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识图谱 - Synapse</title>
<link rel="icon" href="/logo.png">
<style>
:root{--bg:#fafaf8;--panel:#fff;--text:#1a1a18;--muted:#6b6b6b;--line:rgba(0,0,0,.06);--accent:#c96442}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;font-size:14px}
a{color:var(--accent);text-decoration:none}
.container{max-width:900px;margin:0 auto;padding:0 20px}
.navbar{position:fixed;top:0;left:0;right:0;padding:12px 0;background:rgba(250,250,248,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:100}
.navbar .container{display:flex;align-items:center;justify-content:space-between}
.navbar .brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.navbar .brand .logo{width:28px;height:28px;border-radius:6px}
.navbar .links a{color:var(--muted);font-size:13px;margin-left:16px}
.header{padding:80px 0 20px;border-bottom:1px solid var(--line);margin-bottom:24px}
.header h1{font-size:26px;margin-bottom:6px}
.stats-row{display:flex;gap:20px;margin-bottom:24px}
.stat-num{font-size:22px;font-weight:700;color:var(--accent)}
.stat-label{font-size:11px;color:var(--muted)}
.graph-container{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:16px}
.graph-container svg{width:100%;height:70vh}
.footer{border-top:1px solid var(--line);padding:24px 0;margin-top:48px;text-align:center;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="navbar">
  <div class="container">
    <a href="/" class="brand">
      <img class="logo" src="/logo.png" alt="Synapse">
      <span>Synapse</span>
    </a>
    <div class="links">
      <a href="/">首页</a>
      <a href="/wiki.html">笔记</a>
    </div>
  </div>
</div>

<div class="container">
  <div class="header">
    <h1>知识图谱</h1>
    <div class="stats-row">
      <div><div class="stat-num" id="nodeCount">加载中...</div><div class="stat-label">节点</div></div>
      <div><div class="stat-num" id="edgeCount">加载中...</div><div class="stat-label">连接</div></div>
    </div>
  </div>

  <div class="graph-container">
    <svg id="graphSvg" viewBox="0 0 800 600"></svg>
  </div>
</div>

<div class="footer">
  Powered by <a href="https://docs.openclaw.ai">OpenClaw</a>
</div>

<script>
(function() {
  var svg = document.getElementById('graphSvg');
  var nodeCount = document.getElementById('nodeCount');
  var edgeCount = document.getElementById('edgeCount');

  // Generate pseudo-random positions from node id
  function seededPos(id, w, h) {
    var x = Math.sin(id * 12.9898) * 43758.5453;
    x = x - Math.floor(x);
    var y = Math.sin(id * 78.233) * 43758.5453;
    y = y - Math.floor(y);
    return { x: x * (w - 100) + 50, y: y * (h - 100) + 50 };
  }

  fetch('/api/graph')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var nodes = data.nodes || [];
      var edges = data.edges || [];

      nodeCount.textContent = nodes.length;
      edgeCount.textContent = edges.length;

      // Calculate degree for each node
      var degreeMap = {};
      edges.forEach(function(e) {
        degreeMap[e.source] = (degreeMap[e.source] || 0) + 1;
        degreeMap[e.target] = (degreeMap[e.target] || 0) + 1;
      });

      var W = 800, H = 600;
      var colors = ['#c96442', '#5b9abf', '#7b6bbf', '#4a9e8a', '#d4a843', '#bf6b8a', '#6bbf4a', '#bf8a5b'];

      // Generate positions
      var positions = {};
      nodes.forEach(function(n, i) {
        var pos = seededPos(n.id, W, H);
        positions[n.id] = { x: pos.x, y: pos.y };
      });

      var html = '';

      // Edges
      edges.forEach(function(e) {
        var s = positions[e.source];
        var t = positions[e.target];
        if (!s || !t) return;
        html += '<line x1="' + s.x + '" y1="' + s.y + '" x2="' + t.x + '" y2="' + t.y + '" stroke="#d4d4d4" stroke-width="1" opacity="0.5"/>';
      });

      // Nodes
      nodes.forEach(function(n) {
        var pos = positions[n.id];
        var deg = degreeMap[n.id] || 0;
        var r = Math.min(4 + deg * 2, 18);
        var color = colors[(n.id - 1) % colors.length];
        var label = n.title.length > 6 ? n.title.substring(0, 6) + '..' : n.title;

        // Glow for high-degree nodes
        if (deg >= 4) {
          html += '<circle cx="' + pos.x + '" cy="' + pos.y + '" r="' + (r + 5) + '" fill="' + color + '" opacity="0.15"/>';
        }

        html += '<circle cx="' + pos.x + '" cy="' + pos.y + '" r="' + r + '" fill="' + color + '" opacity="0.85"/>';

        if (deg >= 3) {
          html += '<text x="' + pos.x + '" y="' + (pos.y + 4) + '" text-anchor="middle" fill="white" font-size="9" font-weight="600">' + label + '</text>';
        }
      });

      svg.innerHTML = html;
    })
    .catch(function(e) {
      nodeCount.textContent = '加载失败';
      edgeCount.textContent = '';
      console.error('Failed to load graph:', e);
    });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horizon Logo</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --surface: #f5f5f3;
      --border: rgba(0,0,0,0.08);
      --text-primary: #0d0d0d;
      --text-secondary: #777;
      --text-tertiary: #aaa;
      --accent: #e64036;
      --speed-progress: 9%;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    #logo-root {
      width: min(92vw, 490px);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #logo-root svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
      text-rendering: geometricPrecision;
    }

    .atomic-motions {
      display: flex;
      gap: 1.5rem;
      align-items: flex-end;
      justify-content: center;
      flex-wrap: wrap;
    }

    .atom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .atom-stage {
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .atom-stage img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 260ms cubic-bezier(0.34,1.56,0.64,1);
      transform-origin: center;
    }

    .atom-label {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      white-space: nowrap;
    }

    .principles {
      max-width: 760px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill {
      font-size: 11px;
      line-height: 1;
      padding: 5px 10px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .pill.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      font: 12px/1.2 inherit;
      letter-spacing: 0.04em;
      padding: 8px 18px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--text-primary);
      cursor: pointer;
    }

    button.primary {
      color: var(--bg);
      background: var(--text-primary);
      border-color: var(--text-primary);
    }

    .speed-control {
      width: min(340px, 80vw);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      color: var(--text-secondary);
    }

    .speed-caption,
    .speed-value {
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .speed-value {
      min-width: 46px;
      text-align: right;
      color: var(--text-primary);
      text-transform: none;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      flex: 1;
      min-width: 120px;
      height: 24px;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: grab;
      accent-color: var(--accent);
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--speed-progress), var(--border) var(--speed-progress), var(--border) 100%);
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      margin-top: -6.5px;
      border-radius: 50%;
      border: 2px solid var(--bg);
      background: var(--accent);
      box-shadow: 0 1px 6px rgba(0,0,0,0.18);
    }

    .footer {
      font-size: 11px;
      color: var(--text-tertiary);
      text-align: center;
      line-height: 1.7;
    }

    .p2m-chromeless .atomic-motions,
    .p2m-chromeless .principles,
    .p2m-chromeless .controls,
    .p2m-chromeless .footer {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      /* Horizon Logo — Motion CSS
       * Choreography: 1500ms reveal
       *  - 0-200ms:   Anticipation (sun scale 0.95→1.0)
       *  - 200-700ms: Sun rises (scale 0.7→1.0, opacity 0→1, ease-out-back)
       *  - 400-1100ms: Horizon arc draws on (stroke-dashoffset 1→0)
       *  - 700-1200ms: Ripples cascade (scale 0.6→1.0, opacity 0→1, staggered 100ms)
       *  - 900-1500ms: Wordmark letter cascade (translateY 12→0, opacity 0→1, stagger 40ms)
       * All keyframe easings are LITERAL cubic-bezier (not var()).
       */

      :root {
        --p2m-duration: 1500ms;
        --p2m-ease-arc: cubic-bezier(0.22, 0.61, 0.36, 1);
        --p2m-ease-ripple: cubic-bezier(0.16, 1, 0.3, 1);
        --p2m-ease-letter: cubic-bezier(0.33, 1, 0.68, 1);
        --p2m-ease-sun: cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      #logo-root * {
        transform-box: fill-box;
        transform-origin: center;
      }

      /* Sun: rises with ease-out-back overshoot */
      #sun {
        opacity: 0;
        transform: scale(0.7);
        animation: sun-rise 1500ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
        animation-delay: 200ms;
      }
      @keyframes sun-rise {
        0%   { opacity: 0; transform: scale(0.7); }
        /* literal easing in keyframe: ease-out-back */
        33%  { opacity: 1; transform: scale(1.06); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
        100% { opacity: 1; transform: scale(1.0); animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1); }
      }

      /* Horizon arc: draws on left-to-right */
      #horizon-arc {
        stroke: #1e2c3a;
        stroke-width: 0;  /* original is fill, not stroke — use opacity instead */
        fill: #1e2c3a;
        opacity: 0;
        transform: scaleX(0);
        transform-origin: center;
        animation: arc-draw 1500ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
        animation-delay: 400ms;
      }
      @keyframes arc-draw {
        0%   { opacity: 0; transform: scaleX(0); }
        47%  { opacity: 1; transform: scaleX(1.0); animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1); }
        100% { opacity: 1; transform: scaleX(1.0); }
      }

      /* Ripples: cascade in with scale + fade */
      #ripple-1, #ripple-2, #ripple-3 {
        opacity: 0;
        transform: scale(0.6);
      }
      #ripple-1 { animation: ripple-in 1500ms cubic-bezier(0.16, 1, 0.3, 1) both; animation-delay: 700ms; }
      #ripple-2 { animation: ripple-in 1500ms cubic-bezier(0.16, 1, 0.3, 1) both; animation-delay: 800ms; }
      #ripple-3 { animation: ripple-in 1500ms cubic-bezier(0.16, 1, 0.3, 1) both; animation-delay: 900ms; }
      @keyframes ripple-in {
        0%   { opacity: 0; transform: scale(0.6); }
        33%  { opacity: 1; transform: scale(1.0); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
        100% { opacity: 1; transform: scale(1.0); }
      }

      /* Wordmark letters: cascade up from below */
      #wordmark tspan {
        opacity: 0;
        transform: translateY(12px);
      }
      #letter-h  { animation: letter-rise 1500ms cubic-bezier(0.33, 1, 0.68, 1) both; animation-delay: 900ms; }
      #letter-o1 { animation: letter-rise 1500ms cubic-bezier(0.33, 1, 0.68, 1) both; animation-delay: 940ms; }
      #letter-r  { animation: letter-rise 1500ms cubic-bezier(0.33, 1, 0.68, 1) both; animation-delay: 980ms; }
      #letter-i  { animation: letter-rise 1500ms cubic-bezier(0.33, 1, 0.68, 1) both; animation-delay: 1020ms; }
      #letter-z  { animation: letter-rise 1500ms cubic-bezier(0.33, 1, 0.68, 1) both; animation-delay: 1060ms; }
      #letter-o2 { animation: letter-rise 1500ms cubic-bezier(0.33, 1, 0.68, 1) both; animation-delay: 1100ms; }
      #letter-n  { animation: letter-rise 1500ms cubic-bezier(0.33, 1, 0.68, 1) both; animation-delay: 1140ms; }
      @keyframes letter-rise {
        0%   { opacity: 0; transform: translateY(12px); }
        40%  { opacity: 1; transform: translateY(0px); animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
        100% { opacity: 1; transform: translateY(0px); }
      }

      /* Atomic motion studies */

      /* Hover pulse on horizon-arc */
      @keyframes arc-pulse {
        0%, 100% { opacity: 1.0; }
        50%      { opacity: 0.85; }
      }
      #horizon-arc.pulse { animation: arc-pulse 1.6s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

      /* Slow ripple loop */
      @keyframes ripple-breathe {
        0%, 100% { transform: scale(1.0); }
        50%      { transform: scale(1.04); }
      }
      #ripple-1.breathe { animation: ripple-breathe 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

      /* Sun shimmer */
      @keyframes sun-shimmer {
        0%, 100% { transform: rotate(0deg) scale(1.0); }
        50%      { transform: rotate(2deg) scale(1.02); }
      }
      #sun.shimmer { animation: sun-shimmer 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

      /* Letter press on hover */
      #wordmark:hover tspan { transform: translateY(-1px); }
    }
  </style>
</head>
<body>
  <main id="logo-root" aria-label="Animated logo" data-p2m-duration="1500"></main>

  <section class="atomic-motions" aria-label="Atomic motion studies">
    <div class="atom" data-atom="hover"><div class="atom-stage"></div><span class="atom-label">Hover</span></div>
    <div class="atom" data-atom="pulse"><div class="atom-stage"></div><span class="atom-label">Pulse</span></div>
    <div class="atom" data-atom="arc"><div class="atom-stage"></div><span class="atom-label">Arc</span></div>
    <div class="atom" data-atom="press"><div class="atom-stage"></div><span class="atom-label">Press</span></div>
  </section>

  <div class="principles" id="principlesRow">
    <span class="pill" data-p="squashstretch">Squash &amp; stretch</span>
    <span class="pill" data-p="anticipation">Anticipation</span>
    <span class="pill" data-p="staging">Staging</span>
    <span class="pill" data-p="followthrough">Follow through</span>
    <span class="pill" data-p="overlap">Overlapping</span>
    <span class="pill" data-p="slowinout">Slow in / out</span>
    <span class="pill" data-p="arc">Arc</span>
    <span class="pill" data-p="secondary">Secondary action</span>
    <span class="pill" data-p="timing">Timing</span>
    <span class="pill" data-p="appeal">Appeal</span>
  </div>

  <div class="controls">
    <button class="primary" id="btnReplay" type="button">Replay</button>
    <button id="btnSlow" type="button">Slow motion</button>
    <label class="speed-control" for="speedSlider">
      <span class="speed-caption">Speed</span>
      <input id="speedSlider" type="range" min="0.25" max="2.5" step="0.05" value="0.45" aria-label="Animation speed">
      <span class="speed-value" id="speedValue">0.45x</span>
    </label>
  </div>

  <p class="footer">Click the main logo to replay | Drag speed | Try atomic motions</p>

  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";
    const LOGO = {"tag":"svg","attrs":{"viewBox":"0 0 700 609","width":"700","height":"609"},"children":[{"tag":"title","attrs":{},"children":[],"text":"Horizon Logo"},{"tag":"defs","attrs":{},"children":[{"tag":"style","attrs":{},"children":[],"text":".ink { fill: #1e2c3a; }\n      .gold { fill: #b57949; }"}]},{"tag":"g","attrs":{"id":"mark"},"children":[{"tag":"path","attrs":{"id":"sun","class":"gold","d":"M 254,175              C 254,108.74 298.78,55 354,55              C 409.22,55 454,108.74 454,175              L 432,175              C 432,129.72 395.71,93 354,93              C 312.29,93 276,129.72 276,175 Z"},"children":[]},{"tag":"path","attrs":{"id":"horizon-arc","class":"ink","pathLength":"1","d":"M 30,275              C 200,190 510,190 680,275              C 510,240 200,240 30,275 Z"},"children":[]},{"tag":"ellipse","attrs":{"id":"ripple-1","class":"ink","cx":"354","cy":"293","rx":"106","ry":"13"},"children":[]},{"tag":"ellipse","attrs":{"id":"ripple-2","class":"ink","cx":"354","cy":"339","rx":"63","ry":"11"},"children":[]},{"tag":"ellipse","attrs":{"id":"ripple-3","class":"ink","cx":"354","cy":"380","rx":"28","ry":"8"},"children":[]}]},{"tag":"text","attrs":{"id":"wordmark","class":"ink","x":"354","y":"558","text-anchor":"middle","font-family":"Nimbus Sans, FreeSans, Liberation Sans, Arial, sans-serif","font-size":"86","font-weight":"300","letter-spacing":"22"},"children":[{"tag":"tspan","attrs":{"id":"letter-h"},"children":[],"text":"H"},{"tag":"tspan","attrs":{"id":"letter-o1"},"children":[],"text":"o"},{"tag":"tspan","attrs":{"id":"letter-r"},"children":[],"text":"r"},{"tag":"tspan","attrs":{"id":"letter-i"},"children":[],"text":"i"},{"tag":"tspan","attrs":{"id":"letter-z"},"children":[],"text":"z"},{"tag":"tspan","attrs":{"id":"letter-o2"},"children":[],"text":"o"},{"tag":"tspan","attrs":{"id":"letter-n"},"children":[],"text":"n"}]}]};
    const SVG_TEXT = "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 700 609\" width=\"700\" height=\"609\"><style>:root,svg{--bg:#ffffff;--surface:#f5f5f3;--text-primary:#0d0d0d;--text-secondary:#777;--text-tertiary:#aaa;--logo-wordmark:#363e47;--accent:#e64036;--red:#e64036;--red-bright:#ff493f;}<\/style>\n  <title>Horizon Logo<\/title>\n  <defs>\n    <style>\n      .ink { fill: #1e2c3a; }\n      .gold { fill: #b57949; }\n    <\/style>\n  <\/defs>\n\n  <!-- Mark group: sun + horizon + ripples -->\n  <g id=\"mark\">\n    <!-- Gold crescent: cubic Bezier half-ellipses (kappa=0.5522) -->\n    <path id=\"sun\" class=\"gold\"\n          d=\"M 254,175\n             C 254,108.74 298.78,55 354,55\n             C 409.22,55 454,108.74 454,175\n             L 432,175\n             C 432,129.72 395.71,93 354,93\n             C 312.29,93 276,129.72 276,175 Z\" />\n\n    <!-- Horizon arc: shallow arc, symmetric, ~31px thick at center, tapers to points -->\n    <path id=\"horizon-arc\" class=\"ink\"\n          pathLength=\"1\"\n          d=\"M 30,275\n             C 200,190 510,190 680,275\n             C 510,240 200,240 30,275 Z\" />\n\n    <!-- Three ripples (ellipses) -->\n    <ellipse id=\"ripple-1\" class=\"ink\" cx=\"354\" cy=\"293\" rx=\"106\" ry=\"13\" />\n    <ellipse id=\"ripple-2\" class=\"ink\" cx=\"354\" cy=\"339\" rx=\"63\"  ry=\"11\" />\n    <ellipse id=\"ripple-3\" class=\"ink\" cx=\"354\" cy=\"380\" rx=\"28\"  ry=\"8\"  />\n  <\/g>\n\n  <!-- Wordmark: live text, split into tspans for cascade -->\n  <text id=\"wordmark\" class=\"ink\"\n        x=\"354\" y=\"558\"\n        text-anchor=\"middle\"\n        font-family=\"Nimbus Sans, FreeSans, Liberation Sans, Arial, sans-serif\"\n        font-size=\"86\"\n        font-weight=\"300\"\n        letter-spacing=\"22\">\n    <tspan id=\"letter-h\">H<\/tspan><tspan id=\"letter-o1\">o<\/tspan><tspan id=\"letter-r\">r<\/tspan><tspan id=\"letter-i\">i<\/tspan><tspan id=\"letter-z\">z<\/tspan><tspan id=\"letter-o2\">o<\/tspan><tspan id=\"letter-n\">n<\/tspan>\n  <\/text>\n<\/svg>\n";
    const SVG_URI = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(SVG_TEXT);
    const DURATION = 1500;

    let playbackRate = 0.45;
    let pulseRaf = null;
    let arcRaf = null;
    window.__p2mReady = false;

    function createSvgNode(node) {
      const element = document.createElementNS(SVG_NS, node.tag);
      for (const [name, value] of Object.entries(node.attrs || {})) {
        element.setAttribute(name, value);
      }
      if (node.text) {
        element.appendChild(document.createTextNode(node.text));
      }
      for (const child of node.children || []) {
        element.appendChild(createSvgNode(child));
      }
      return element;
    }

    function heroAnimations() {
      const root = document.getElementById("logo-root");
      if (root.getAnimations) return root.getAnimations({ subtree: true });
      return document.getAnimations().filter(animation => {
        const target = animation.effect && animation.effect.target;
        return target && root.contains(target);
      });
    }

    function applyPlaybackRate() {
      for (const animation of heroAnimations()) {
        if (animation.updatePlaybackRate) animation.updatePlaybackRate(playbackRate);
        else animation.playbackRate = playbackRate;
      }
    }

    function renderHero() {
      const root = document.getElementById("logo-root");
      root.replaceChildren(createSvgNode(LOGO));
      const svg = root.querySelector("svg");
      if (svg) {
        svg.removeAttribute("width");
        svg.removeAttribute("height");
        svg.style.width = "100%";
        svg.style.height = "auto";
        svg.style.overflow = "visible";
      }
      requestAnimationFrame(() => requestAnimationFrame(applyPlaybackRate));
    }

    function flashPills(...names) {
      document.querySelectorAll(".pill").forEach(pill => pill.classList.remove("active"));
      names.forEach(name => {
        const pill = document.querySelector(`[data-p="${name}"]`);
        if (pill) pill.classList.add("active");
      });
    }

    function cyclePrinciples() {
      const phases = [
        ["staging", "timing"],
        ["anticipation", "squashstretch"],
        ["arc", "slowinout"],
        ["overlap", "followthrough"],
        ["appeal"]
      ];
      let i = 0;
      flashPills(...phases[0]);
      return setInterval(() => {
        i = (i + 1) % phases.length;
        flashPills(...phases[i]);
      }, Math.max(240, DURATION / phases.length / Math.max(playbackRate, 0.25)));
    }

    let pillTimer = null;
    function replayMain() {
      clearInterval(pillTimer);
      renderHero();
      pillTimer = cyclePrinciples();
      setTimeout(() => {
        clearInterval(pillTimer);
        document.querySelectorAll(".pill").forEach(pill => pill.classList.remove("active"));
      }, DURATION / Math.max(playbackRate, 0.25) + 600);
    }

    function formatSpeed(rate) {
      return `${rate.toFixed(2)}x`;
    }

    function updateSpeedUI() {
      const slider = document.getElementById("speedSlider");
      const value = Number(slider.value);
      const min = Number(slider.min);
      const max = Number(slider.max);
      const progress = ((value - min) / (max - min)) * 100;
      document.getElementById("speedValue").textContent = formatSpeed(value);
      slider.style.setProperty("--speed-progress", `${progress}%`);
      const slow = value <= 0.251;
      const btnSlow = document.getElementById("btnSlow");
      btnSlow.textContent = slow ? "Normal speed" : "Slow motion";
      btnSlow.style.background = slow ? "var(--surface)" : "";
      btnSlow.style.borderColor = slow ? "var(--text-secondary)" : "";
    }

    function setPlaybackRate(rate, replay = false) {
      const slider = document.getElementById("speedSlider");
      const min = Number(slider.min);
      const max = Number(slider.max);
      playbackRate = Math.min(max, Math.max(min, Number(rate)));
      slider.value = String(playbackRate);
      updateSpeedUI();
      applyPlaybackRate();
      if (replay) replayMain();
    }

    function setupAtomImages() {
      document.querySelectorAll(".atom-stage").forEach(stage => {
        const img = new Image();
        img.src = SVG_URI;
        img.alt = "";
        stage.appendChild(img);
      });
    }

    function setupAtoms() {
      const hover = document.querySelector('[data-atom="hover"] img');
      const pulse = document.querySelector('[data-atom="pulse"] img');
      const arc = document.querySelector('[data-atom="arc"] img');
      const press = document.querySelector('[data-atom="press"] img');

      hover.parentElement.addEventListener("mouseenter", () => {
        flashPills("squashstretch", "appeal");
        hover.style.transform = "scale(1.08) rotate(-1.5deg)";
      });
      hover.parentElement.addEventListener("mouseleave", () => {
        hover.style.transform = "scale(1)";
      });

      function pulseTick(ts) {
        const p = (Math.sin(ts / 900) + 1) / 2;
        pulse.style.transform = `scale(${1 + 0.1 * p})`;
        pulseRaf = requestAnimationFrame(pulseTick);
      }
      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        pulseRaf = requestAnimationFrame(pulseTick);
      }

      let arcAngle = -14;
      let arcVel = 0;
      function arcTick() {
        arcVel += (0 - arcAngle) * 0.08;
        arcVel *= 0.86;
        arcAngle += arcVel;
        arc.style.transform = `rotate(${arcAngle}deg)`;
        arcRaf = requestAnimationFrame(arcTick);
      }
      arc.parentElement.addEventListener("mouseenter", () => {
        flashPills("arc", "anticipation", "appeal");
        cancelAnimationFrame(arcRaf);
        arcAngle = 28;
        arcVel = 0;
        arcTick();
      });
      arc.parentElement.addEventListener("mouseleave", () => {
        arcAngle = 0;
      });

      press.parentElement.addEventListener("mousedown", () => {
        flashPills("squashstretch", "anticipation");
        press.style.transform = "scaleX(1.10) scaleY(0.88)";
      });
      ["mouseup", "mouseleave"].forEach(ev => {
        press.parentElement.addEventListener(ev, () => {
          press.style.transform = "scale(1)";
        });
      });
    }

    function applyQaMode() {
      const params = new URLSearchParams(location.search);
      const seekMs = params.get("t");
      const staticMode = params.get("static");
      if (seekMs === null && staticMode === null) {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          applyPlaybackRate();
          window.__p2mReady = true;
        }));
        return;
      }

      document.documentElement.classList.add("p2m-chromeless");
      cancelAnimationFrame(pulseRaf);
      cancelAnimationFrame(arcRaf);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        for (const animation of heroAnimations()) {
          if (staticMode !== null) {
            try {
              animation.finish();
            } catch (err) {
              animation.cancel();
            }
          } else {
            animation.pause();
            animation.currentTime = Number(seekMs);
          }
        }
        window.__p2mReady = true;
      }));
    }

    document.getElementById("btnReplay").addEventListener("click", replayMain);
    document.getElementById("logo-root").addEventListener("click", replayMain);
    document.getElementById("speedSlider").addEventListener("input", event => {
      setPlaybackRate(event.target.value, false);
    });
    document.getElementById("btnSlow").addEventListener("click", () => {
      const slow = Number(document.getElementById("speedSlider").value) <= 0.251;
      setPlaybackRate(slow ? 0.45 : 0.25, true);
    });

    setupAtomImages();
    setupAtoms();
    setPlaybackRate(0.45, false);
    renderHero();
    applyQaMode();
  </script>
</body>
</html>

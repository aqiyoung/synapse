<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect x="1" y="1" width="30" height="30" rx="8" fill="#c96442"/>
  <!-- Connection lines (diagonal) -->
  <line x1="16" y1="6" x2="8" y2="16" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="16" y1="6" x2="24" y2="16" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="8" y1="16" x2="16" y2="26" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="24" y1="16" x2="16" y2="26" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Cross lines (horizontal + vertical) -->
  <line x1="8" y1="16" x2="24" y2="16" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <line x1="16" y1="6" x2="16" y2="26" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <!-- Central node (largest) -->
  <circle cx="16" cy="16" r="4" fill="#fff"/>
  <!-- Top node -->
  <circle cx="16" cy="6" r="2.5" fill="#fff" opacity="0.85"/>
  <!-- Left node -->
  <circle cx="8" cy="16" r="2.5" fill="#fff" opacity="0.85"/>
  <!-- Right node -->
  <circle cx="24" cy="16" r="2.5" fill="#fff" opacity="0.85"/>
  <!-- Bottom node -->
  <circle cx="16" cy="26" r="2.5" fill="#fff" opacity="0.85"/>
  <!-- Small accent nodes (corners) -->
  <circle cx="11" cy="11" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="21" cy="11" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="11" cy="21" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="21" cy="21" r="1.5" fill="#fff" opacity="0.5"/>
</svg>

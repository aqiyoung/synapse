<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect x="1" y="1" width="30" height="30" rx="8" fill="#c96442"/>
  <!-- Connection lines (diagonal) -->
  <line x1="16" y1="10" x2="10" y2="16" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="16" y1="10" x2="22" y2="16" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="10" y1="16" x2="16" y2="22" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="22" y1="16" x2="16" y2="22" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Cross lines (horizontal + vertical) -->
  <line x1="10" y1="16" x2="22" y2="16" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <line x1="16" y1="10" x2="16" y2="22" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <!-- Central node (largest) -->
  <circle cx="16" cy="16" r="4" fill="#fff"/>
  <!-- Top node -->
  <circle cx="16" cy="10" r="2.5" fill="#fff" opacity="0.85"/>
  <!-- Left node -->
  <circle cx="10" cy="16" r="2.5" fill="#fff" opacity="0.85"/>
  <!-- Right node -->
  <circle cx="22" cy="16" r="2.5" fill="#fff" opacity="0.85"/>
  <!-- Bottom node -->
  <circle cx="16" cy="22" r="2.5" fill="#fff" opacity="0.85"/>
  <!-- Small accent nodes (corners) -->
  <circle cx="10" cy="10" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="22" cy="10" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="10" cy="22" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="22" cy="22" r="1.5" fill="#fff" opacity="0.5"/>
</svg>

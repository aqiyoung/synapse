<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synapse · AI 知识管理</title>
<link rel="icon" type="image/png" href="/logo.png">
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
:root {
  --bg: #fafaf8;
  --panel: #ffffff;
  --text: #1a1a18;
  --text-secondary: #6b6964;
  --muted: #999590;
  --accent: #c96442;
  --radius: 8px;
  --font: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-serif: 'Playfair Display', Georgia, serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; }
a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
a:hover { color: #b8543a; }

.nav {
  position: fixed; top: 0; left: 0; right: 0;
  padding: 12px 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(250,250,248,0.9);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(0,0,0,0.06);
  z-index: 100;
}
.nav-inner { width: 100%; max-width: 800px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; }
.nav-brand { display: flex; align-items: center; gap: 8px; }
.nav-brand .logo { width: 28px; height: 28px; border-radius: 6px; }
.nav-logo { font-family: var(--font-serif); font-weight: 700; font-size: 18px; color: var(--text); }
.nav-logo span { color: var(--accent); }

.hero {
  padding: 120px 24px 60px;
  text-align: center;
}
.hero-title {
  font-family: var(--font-serif);
  font-size: clamp(36px, 7vw, 60px);
  font-weight: 700;
  line-height: 1.1;
  color: var(--text);
  letter-spacing: -1px;
  margin-bottom: 16px;
}
.hero-title span { color: var(--accent); }
.hero-subtitle {
  font-size: 17px;
  color: var(--text-secondary);
  max-width: 520px;
  margin: 0 auto 28px;
  line-height: 1.8;
}
.hero-cta {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 14px 28px;
  background: var(--accent);
  color: #fff;
  border-radius: 6px;
  font-size: 15px;
  font-weight: 600;
  transition: all 0.3s;
  box-shadow: 0 2px 12px rgba(201,100,66,0.25);
}
.hero-cta:hover {
  background: #b8543a;
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(201,100,66,0.35);
  color: #fff;
}

.features {
  padding: 40px 24px 80px;
  max-width: 800px;
  margin: 0 auto;
  text-align: center;
}
.features-title {
  font-family: var(--font-serif);
  font-size: 24px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 32px;
}
.features-title span { color: var(--accent); }
.features-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}
.feature-card {
  background: var(--panel);
  border: 1px solid rgba(0,0,0,0.06);
  border-radius: var(--radius);
  padding: 28px 20px;
  transition: all 0.3s;
}
.feature-card:hover {
  border-color: rgba(201,100,66,0.2);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
}
.feature-icon { font-size: 32px; margin-bottom: 14px; }
.feature-title { font-family: var(--font-serif); font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
.feature-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

.footer { border-top: 1px solid rgba(0,0,0,0.06); padding: 24px; text-align: center; color: var(--muted); font-size: 12px; }
.footer a { color: var(--accent); }

@media (max-width: 768px) {
  .features-grid { grid-template-columns: 1fr; }
  .hero { padding: 100px 16px 40px; }
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-brand">
      <img class="logo" src="/logo.png" alt="" style="vertical-align:middle">
      <div class="nav-logo">Syn<span>apse</span></div>
    </a>
    <div class="nav-links" style="display:flex;gap:16px">
      <a href="/wiki.html" style="color:var(--text-secondary);font-size:13px">笔记</a>
      <a href="/graph.html" style="color:var(--text-secondary);font-size:13px">图谱</a>
    </div>
  </div>
</nav>

<section class="hero">
  <h1 class="hero-title">沉淀你的<br><span>知识宇宙</span></h1>
  <p class="hero-subtitle">一个属于运维工程师的私人知识库。让零散的笔记变成有温度的知识网络，让每一次排查都有迹可循。</p>
  <a href="https://wiki.threel.site/wiki.html?view=kb" class="hero-cta">进入知识库</a>
</section>

<section class="features">
  <div class="features-title">为什么用 Syn<span>apse</span></div>
  <div class="features-grid">
    <div class="feature-card">
      <div class="feature-icon">🧠</div>
      <div class="feature-title">AI 驱动</div>
      <div class="feature-desc">智能标签自动提取、知识关联推荐、自然语言查询。让 AI 成为你的知识管家。</div>
    </div>
    <div class="feature-card">
      <div class="feature-icon">🔗</div>
      <div class="feature-title">知识图谱</div>
      <div class="feature-desc">笔记之间的关联一目了然。每个知识点都是知识网络的一个节点。</div>
    </div>
    <div class="feature-card">
      <div class="feature-icon">⚡</div>
      <div class="feature-title">极速访问</div>
      <div class="feature-desc">纯前端渲染，毫秒级响应。不需要等后端返回，所有数据已经在你的浏览器里。</div>
    </div>
  </div>
</section>

<footer class="footer">
  <p>Synapse · 私人知识库</p>
</footer>

<script>
const { createApp } = Vue;
createApp({}).mount('#app');
</script>
</body>
</html>

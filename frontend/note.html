<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>笔记详情 - Synapse</title>
<link rel="icon" href="/logo.png">
<style>
:root{--bg:#fafaf8;--panel:#fff;--text:#1a1a18;--muted:#6b6b6b;--line:rgba(0,0,0,.06);--accent:#c96442;--accent-light:rgba(201,100,66,.08);--accent-hover:#b8543a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;font-size:14px}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-hover)}
.container{max-width:700px;margin:0 auto;padding:0 20px}
.navbar{position:fixed;top:0;left:0;right:0;padding:12px 0;background:rgba(250,250,248,0.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(0,0,0,0.06);z-index:100}
.navbar .container{max-width:700px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between}
.navbar .brand{display:flex;align-items:center;gap:8px;text-decoration:none}
.navbar .brand .logo{width:28px;height:28px;border-radius:6px}
.navbar .brand-text{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:18px;color:var(--text)}
.navbar .brand-text span{color:var(--accent)}
.navbar .links a{color:var(--muted);font-size:13px;margin-left:16px}
.navbar .links a:hover{color:var(--accent)}
.back{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:6px;font-size:13px;color:var(--muted);cursor:pointer;margin:100px 0 24px}
.back:hover{border-color:var(--accent);color:var(--accent)}
h1{font-size:28px;font-weight:500;margin-bottom:12px;line-height:1.3}
.meta{font-size:13px;color:var(--muted);margin-bottom:32px}
.tag{display:inline-block;padding:2px 8px;margin-right:6px;border-radius:4px;background:var(--accent-light);color:var(--accent);font-size:11px}
.content{font-size:15px;line-height:1.9}
.content h1,.content h2,.content h3{font-weight:500;margin:24px 0 12px}
.content h1{font-size:22px}.content h2{font-size:18px}.content h3{font-size:15px}
.content p{margin:10px 0}
.content code{background:#f2f2ef;padding:2px 6px;border-radius:4px;font-size:13px}
.content pre{background:#1e1e2e;color:#a6e22e;padding:16px;border-radius:6px;overflow-x:auto;margin:16px 0}
.content pre code{background:none;padding:0;color:inherit}
.content a{color:var(--accent)}
.loading{text-align:center;padding:60px 0;color:var(--muted)}
.footer{border-top:1px solid var(--line);padding:24px 0;margin-top:48px;text-align:center;font-size:12px;color:var(--muted)}
</style>
<script src="/js/marked.min.js"></script>
</head>
<body>
<div class="navbar">
  <div class="container">
    <a href="/" class="brand">
      <img class="logo" src="/logo.png" alt="">
      <span class="brand-text">Syn<span>apse</span></span>
    </a>
    <div class="links">
      <a href="/">首页</a>
      <a href="/wiki.html">笔记</a>
      <a href="/graph.html">图谱</a>
    </div>
  </div>
</div>

<div class="container">
  <div class="back" onclick="window.history.back()">← 返回</div>
  <div id="noteContent">
    <div class="loading">加载中...</div>
  </div>
</div>

<div class="footer">
  Synapse · 私人知识库
</div>

<script>
(function() {
  // Support both /note/123 and /note.html?id=123
  var noteId = window.location.pathname.split('/').pop();
  if (!noteId || noteId === 'note.html') {
    var params = new URLSearchParams(window.location.search);
    noteId = params.get('id');
  }
  var container = document.getElementById('noteContent');

  fetch('/api/notes/' + noteId)
    .then(function(r) { return r.json(); })
    .then(function(note) {
      if (!note || !note.title) {
        container.innerHTML = '<div class="loading">笔记不存在</div>';
        return;
      }
      document.title = note.title;

      var html = '<h1>' + note.title + '</h1>';

      // Meta
      var meta = [];
      if (note.source_created_at) {
        meta.push(formatDate(note.source_created_at));
      } else if (note.created_at) {
        meta.push(formatDate(note.created_at));
      }
      if (note.tags && note.tags.length) {
        note.tags.forEach(function(t) {
          meta.push('<span class="tag">' + t + '</span>');
        });
      }
      if (meta.length) {
        html += '<div class="meta">' + meta.join('') + '</div>';
      }

      // Content
      if (typeof marked !== 'undefined' && note.content) {
        html += '<div class="content">' + marked.parse(note.content) + '</div>';
      } else if (note.content) {
        html += '<div class="content"><pre>' + note.content + '</pre></div>';
      }

      container.innerHTML = html;
    })
    .catch(function() {
      container.innerHTML = '<div class="loading">加载失败</div>';
    });

  function formatDate(d) {
    var date = new Date(d);
    return date.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Vue Test</title>
<script src="https://wiki.threel.site/js/vue.global.prod.js"></script>
</head>
<body>
<div id="app">
  <h1>Counter: {{ count }}</h1>
  <button @click="count++">+1</button>
</div>
<script>
const { createApp, ref } = Vue;
createApp({
  setup() {
    const count = ref(0);
    return { count };
  }
}).mount('#app');
</script>
</body>
</html>

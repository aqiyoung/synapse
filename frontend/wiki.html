<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>知识笔记 - <span style="color:#1a1a1a">Syn</span>apse</title>
<link rel="icon" href="/logo.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Georgia,'Noto Sans SC',serif;background:#fafaf8;color:#1a1a18;line-height:1.6;font-size:15px}
a{color:#c96442;text-decoration:none}
a:hover{color:#b8543a}
.container{max-width:900px;margin:0 auto;padding:0 20px}
.nav{position:fixed;top:0;left:0;right:0;background:rgba(250,250,248,.95);backdrop-filter:blur(8px);border-bottom:1px solid rgba(0,0,0,.06);z-index:100}
.nav-inner{max-width:900px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-weight:700;font-size:18px}
.header{padding:80px 0 20px}
.header h1{font-size:26px;margin-bottom:6px}
.stats{display:flex;gap:20px;padding:14px 0;border-top:1px solid rgba(0,0,0,.06);border-bottom:1px solid rgba(0,0,0,.06);margin-bottom:24px}
.stat-num{font-size:22px;font-weight:700;color:#c96442}
.stat-label{font-size:11px;color:#999}
.notes{display:flex;flex-direction:column;gap:12px}
.note{background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:8px;padding:16px 20px;cursor:pointer;transition:border-color .15s}
.note:hover{border-color:rgba(201,100,66,.3)}
.note h2{font-size:15px;font-weight:600;margin-bottom:4px}
.note p{font-size:13px;color:#555;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note .meta{margin-top:8px;font-size:11px;color:#aaa}
.tag{display:inline-block;padding:1px 6px;margin-right:4px;border-radius:3px;background:rgba(201,100,66,.08);color:#c96442;font-size:9px}
.empty{text-align:center;padding:40px;color:#999}
.pager{display:flex;gap:4px;justify-content:center;align-items:center;margin:30px 0;flex-wrap:wrap}
.pager button{background:none;border:1px solid rgba(0,0,0,.1);padding:6px 12px;border-radius:4px;cursor:pointer;font-size:13px}
.pager button:hover:not(:disabled){border-color:#c96442;color:#c96442}
.pager button.active{background:#c96442;border-color:#c96442;color:#fff}
.pager button:disabled{opacity:.3;cursor:not-allowed}
.pager span{font-size:12px;color:#999;margin:0 8px}
.tagcloud{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:30px 0}
.tag-pill{display:inline-flex;align-items:center;gap:2px;padding:3px 10px;border:1px solid rgba(0,0,0,.06);border-radius:14px;font-size:11px;cursor:pointer;background:#fff}
.tag-pill:hover{background:#c96442;border-color:#c96442;color:#fff}
.footer{border-top:1px solid rgba(0,0,0,.06);padding:20px 0;margin-top:40px;text-align:center;font-size:11px;color:#999}

.kb-header h1 {
  font-size: 32px;
  font-weight: 400;
  color: #1a1a1a;
  margin-bottom: 16px;
  letter-spacing: -0.5px;
}
.kb-header p {
  color: #6b6b6b;
  font-size: 14px;
  max-width: 500px;
  margin: 0 auto;
  line-height: 1.7;
}
.kb-list {
  max-width: 680px;
  margin: 0 auto;
}
.kb-list .note {
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(0,0,0,.06);
  border-radius: 0;
  padding: 20px 0;
  cursor: pointer;
}
.kb-list .note:hover {
  background: rgba(201,100,66,.02);
  border-color: rgba(201,100,66,.15);
}
.kb-list .note h2 {
  font-size: 15px;
  font-weight: 600;
  color: #1a1a1a;
  margin-bottom: 6px;
  font-family: 'Noto Sans SC', -apple-system, sans-serif;
}
.kb-list .note p {
  color: #555;
  font-size: 13px;
  line-height: 1.7;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.kb-list .note .meta {
  margin-top: 8px;
  font-size: 11px;
  color: #999;
}
.kb-search {
  text-align: center;
  margin-bottom: 40px;
}
.kb-search input {
  width: 100%;
  max-width: 400px;
  padding: 10px 16px;
  border: 1px solid rgba(0,0,0,.1);
  border-radius: 6px;
  font-size: 14px;
  outline: none;
}
.kb-search input:focus {
  border-color: #c96442;
}
</style>
<script src="js/vue.global.prod.js"></script>
<script src="js/marked.min.js"></script>
</head>
<body>
<div class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo"><span style="color:#1a1a1a">Syn</span>apse 知识库</a>
    <div><a href="/">首页</a> · <a href="/wiki.html">笔记</a></div>
  </div>
</div>
<div id="app">
<div class="container">
<div class="header"><h1>知识笔记</h1></div>
<div class="stats">
  <div class="stat"><div class="stat-num">{{ totalNotes }}</div><div class="stat-label">笔记</div></div>
  <div class="stat"><div class="stat-num">{{ tagList.length }}</div><div class="stat-label">标签</div></div>
  <div class="stat"><div class="stat-num">{{ edges }}</div><div class="stat-label">关联</div></div>
</div>

<!-- KB Search -->
<!-- Note List -->
<div class="notes" v-if="notes.length">
  <div v-for="n in notes" :key="n.id" class="note" @click="openNote(n.id)">
    <h2>{{ n.title }}</h2>
    <p>{{ preview(n.content) }}</p>
    <div class="meta">
      {{ fmt(n.source_created_at || n.created_at) }}
      <span v-for="t in n.tags" :key="t" class="tag">{{ t }}</span>
    </div>
  </div>
</div>
<div v-else class="empty">暂无笔记</div>

<!-- 分页 -->
<div class="pager" v-if="totalPages > 1">
  <button :disabled="page === 1" @click="go(page - 1)">上一页</button>
  <button v-for="p in pageList" :key="p" :class="{ active: p === page }" @click="go(p)">{{ p }}</button>
  <button :disabled="page === totalPages" @click="go(page + 1)">下一页</button>
  <span>{{ page }} / {{ totalPages }}</span>
</div>

<!-- 标签云 -->
<div class="tagcloud" v-if="tagList.length">
  <span v-for="t in tagList" :key="t.name" class="tag-pill" @click="filterByTag(t.name)">
    {{ t.name }} <small style="opacity:.6;margin-left:2px">{{ t.count }}</small>
  </span>
</div>

<div class="footer">
  <p><a href="/">← 返回首页</a></p>
  <p style="margin-top:8px"><a href="https://docs.openclaw.ai">OpenClaw</a> 驱动 · <span style="color:#1a1a1a">Syn</span>apse 知识库</p>
</div>
</div>
</div>
<script>
const { createApp, ref, onMounted, computed } = Vue;
const API = '/api';
const TOKEN = 'Bearer 535f740c4b4f1963bb19353654ed6dcdcd988fa64b51277ad4d142cdc75bc05e';
const PER_PAGE = 15;
const headers = { Authorization: TOKEN, 'Content-Type': 'application/json' };

function fmtDate(d) {
  if (!d) return '';
  const diff = Date.now() - new Date(d);
  if (diff < 86400000) return '今天';
  if (diff < 172800000) return '昨天';
  if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
  return new Date(d).toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
}

function preview(text) {
  if (!text) return '';
  return text.replace(/^#+\s/gm, '').substring(0, 120) + (text.length > 120 ? '...' : '');
}

createApp({
  setup() {
    const notes = ref([]);
    const tagList = ref([]);
    const totalNotes = ref(0);
    const edges = ref(0);
    const page = ref(1);

    async function fetchPage() {
      const skip = (page.value - 1) * PER_PAGE;
      const res = await fetch(API + '/notes?skip=' + skip + '&limit=' + PER_PAGE, { headers });
      const data = await res.json();
      notes.value = data.notes || [];
      totalNotes.value = data.total || 0;
    }

    async function fetchTags() {
      const res = await fetch(API + '/tags', { headers });
      const data = await res.json();
      tagList.value = data.filter(t => t.count > 0).sort((a, b) => b.count - a.count).slice(0, 30);
      stats.value.tags = data.length;
      edges.value = data.reduce((sum, t) => sum + t.count, 0);
    }

    const stats = ref({ tags: 0 });

    function go(p) {
      const total = Math.ceil(totalNotes.value / PER_PAGE);
      if (p < 1 || p > total) return;
      page.value = p;
      fetchPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openNote(id) {
      window.location.hash = 'note-' + id;
    }

    function filterByTag(tag) {
      alert('筛选: ' + tag);
    }

    const totalPages = computed(() => Math.ceil(totalNotes.value / PER_PAGE));
    const pageList = computed(() => {
      const pages = [];
      for (let i = 1; i <= totalPages.value; i++) pages.push(i);
      return pages;
    });

    onMounted(() => {
      fetchPage();
      fetchTags();
    });

    return {
      notes, tagList, totalNotes, edges, page, totalPages, pageList,
      go, openNote, filterByTag, fmt: fmtDate, preview, stats
    };
  }
}).mount('#app');
</script>
</body>
</html>

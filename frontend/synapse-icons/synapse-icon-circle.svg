<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgCircle" cx="512" cy="512" r="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAF9F5"/>
      <stop offset="1" stop-color="#F0EEE6"/>
    </radialGradient>
    <filter id="shadowCircle">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="512" cy="512" r="512" fill="url(#bgCircle)"/>

  <!-- Connection lines - thick and equal length -->
  <line x1="280" y1="320" x2="512" y2="448" stroke="#D97757" stroke-width="24" opacity="0.9" stroke-linecap="round"/>
  <line x1="744" y1="320" x2="512" y2="448" stroke="#5B9ABF" stroke-width="24" opacity="0.9" stroke-linecap="round"/>
  <line x1="512" y1="704" x2="512" y2="448" stroke="#7B6BBF" stroke-width="24" opacity="0.9" stroke-linecap="round"/>

  <!-- Top-left node - Terracotta -->
  <circle cx="280" cy="320" r="72" fill="#D97757" filter="url(#shadowCircle)"/>
  <circle cx="280" cy="320" r="36" fill="#FAF9F5"/>

  <!-- Top-right node - Teal blue -->
  <circle cx="744" cy="320" r="72" fill="#5B9ABF" filter="url(#shadowCircle)"/>
  <circle cx="744" cy="320" r="36" fill="#FAF9F5"/>

  <!-- Bottom node - Purple -->
  <circle cx="512" cy="704" r="72" fill="#7B6BBF" filter="url(#shadowCircle)"/>
  <circle cx="512" cy="704" r="36" fill="#FAF9F5"/>

  <!-- Center synapse -->
  <circle cx="512" cy="448" r="48" fill="#FFFFFF" stroke="#333333" stroke-width="8" filter="url(#shadowCircle)"/>
  <circle cx="512" cy="448" r="20" fill="#333333"/>
</svg>

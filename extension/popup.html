<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 300px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; color: #1a202c; }
.hd { padding: 12px 14px; background: linear-gradient(135deg, #0066ff, #7c3aed); color: #fff; font-weight: 700; font-size: 14px; }
.bd { padding: 12px 14px; }
.row { margin-bottom: 10px; }
.row label { display: block; font-size: 11px; color: #8b96a5; margin-bottom: 4px; font-weight: 600; }
.row input, .row select { width: 100%; padding: 7px 10px; border: 1.5px solid #c8d0da; border-radius: 8px; font-size: 13px; outline: none; background: #fff; color: #1a202c; }
.row input:focus, .row select:focus { border-color: #0066ff; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; cursor: pointer; background: #e8edf2; color: #4a5568; border: 1.5px solid transparent; transition: all .15s; }
.tag.on { background: rgba(0,102,255,.1); color: #0066ff; border-color: #0066ff; }
.btn { width: 100%; padding: 9px 0; border-radius: 8px; border: none; background: linear-gradient(135deg, #0066ff, #3385ff); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; }
.btn:hover { box-shadow: 0 2px 12px rgba(0,102,255,.3); transform: translateY(-1px); }
.btn:disabled { opacity: .5; cursor: wait; transform: none; box-shadow: none; }
.btn-ghost { background: #e8edf2; color: #4a5568; }
.btn-ghost:hover { background: #d4dbe3; box-shadow: none; }
.status { padding: 8px 12px; border-radius: 8px; font-size: 12px; margin-top: 8px; display: none; }
.status.ok { display: block; background: rgba(0,184,122,.1); color: #00b87a; }
.status.err { display: block; background: rgba(229,62,62,.1); color: #e53e3e; }
.ft { padding: 8px 14px; border-top: 1px solid #e8edf2; font-size: 10px; color: #8b96a5; display: flex; justify-content: space-between; align-items: center; }
.ft a { color: #0066ff; text-decoration: none; }
</style>
</head>
<body>
<div class="hd">🧠 Synapse</div>
<div class="bd">
  <div class="row">
    <label>标题</label>
    <input id="title" type="text" placeholder="自动获取网页标题" />
  </div>
  <div class="row">
    <label>标签</label>
    <div class="tags" id="tags"></div>
    <input id="customTag" type="text" placeholder="+ 自定义标签" style="margin-top:6px" />
  </div>
  <div class="row">
    <label>API 地址</label>
    <input id="apiUrl" type="text" value="http://127.0.0.1:18800" />
  </div>
  <button class="btn" id="clipBtn">📥 保存当前页面</button>
  <div class="status" id="status"></div>
</div>
<div class="ft">
  <span id="pageInfo"></span>
  <a href="#" id="openWiki">打开 Synapse →</a>
</div>
<script src="popup.js"></script>
</body>
</html>

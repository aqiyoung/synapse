server {
    listen 80;
    server_name knowledge.local;

    root /vol1/1000/knowledge-base/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        alias /vol1/1000/knowledge-base/uploads/;
        expires 30d;
    }
}
